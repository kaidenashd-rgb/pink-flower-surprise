
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030103;
  color: #ffd0e6;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: 'Cormorant Garamond', serif;
}

#intro {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #030103;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 25px;
  transition: opacity 1.5s ease, visibility 1.5s;
}

#intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.icons {
  display: flex;
  gap: 30px;
  margin-bottom: 35px;
  font-size: 42px;
  filter: drop-shadow(0 0 12px #ff83c5);
  animation: float 3s ease-in-out infinite;
}

.intro-title {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(38px, 9vw, 65px);
  font-weight: normal;
  text-align: center;
  color: #ffc1df;
  text-shadow: 0 0 10px #ff70bd,
               0 0 25px #ff399d,
               0 0 50px #c90067;
  margin-bottom: 45px;
}

#openBtn {
  padding: 14px 30px;
  border: 1px solid #ff9ccc;
  border-radius: 40px;
  background: rgba(255, 105, 180, 0.12);
  color: #ffd8e9;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  letter-spacing: 1px;
  box-shadow: 0 0 12px #ff72b7,
              inset 0 0 12px rgba(255, 100, 180, 0.15);
  cursor: pointer;
  transition: .3s;
}

#openBtn:active {
  transform: scale(.94);
}

#garden {
  min-height: 100vh;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 65px 15px;
  position: relative;
  overflow: hidden;
}

#garden.show {
  display: flex;
  animation: reveal 2s ease both;
}

@keyframes reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}

.garden-title {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(35px, 8vw, 55px);
  color: #ffc0df;
  text-align: center;
  text-shadow: 0 0 15px #ff58b0;
  margin-bottom: 35px;
}

.flower-orbit {
  width: min(88vw, 390px);
  height: min(88vw, 390px);
  position: relative;
  border-radius: 50%;
  animation: rotate 32s linear infinite;
  filter: drop-shadow(0 0 13px rgba(255, 90, 180, .5));
}

.flower {
  position: absolute;
  width: 43%;
  height: 43%;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: counterRotate 32s linear infinite,
             sway 4s ease-in-out infinite;
}

.flower img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 12px #ff5eae)
         drop-shadow(0 0 25px #c92b82);
}

.flower:nth-child(1) {
  top: 0;
  left: 28%;
}

.flower:nth-child(2) {
  top: 28%;
  right: 0;
}

.flower:nth-child(3) {
  bottom: 0;
  left: 28%;
}

.flower:nth-child(4) {
  top: 28%;
  left: 0;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes counterRotate {
  to { transform: rotate(-360deg); }
}

@keyframes sway {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -7px; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.center-heart {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 43px;
  color: #ffacd5;
  text-shadow: 0 0 15px #ff58b0,
               0 0 35px #ff148e;
  animation: heartbeat 2s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.side-flower {
  position: absolute;
  font-size: 27px;
  color: #ffb4d8;
  opacity: .8;
  text-shadow: 0 0 12px #ff49a8;
  animation: float 4s ease-in-out infinite;
}

.side-flower.one {
  top: 15%;
  left: 9%;
}

.side-flower.two {
  top: 25%;
  right: 10%;
  animation-delay: 1s;
}

.side-flower.three {
  bottom: 15%;
  left: 12%;
  animation-delay: 2s;
}

.side-flower.four {
  bottom: 20%;
  right: 10%;
  animation-delay: .5s;
}

.petal {
  position: fixed;
  top: -30px;
  z-index: 2;
  pointer-events: none;
  color: #ff9bc9;
  text-shadow: 0 0 12px #ff4ca7;
  animation: falling linear forwards;
}

@keyframes falling {
  to {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

.music-control {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 5;
  background: rgba(255, 90, 165, .15);
  border: 1px solid #ff9ccc;
  border-radius: 50%;
  width: 45px;
  height: 45px;
  color: #ffc5df;
  font-size: 19px;
  box-shadow: 0 0 15px #ff64b0;
  cursor: pointer;
  display: none;
}

#garden.show ~ .music-control {
  display: block;
}

@media (prefers-reduced-motion: reduce) {
  .flower-orbit, .flower, .icons, .side-flower {
    animation-duration: 0.01ms;
  }
}
</style>
</head>

<body>

<div id="intro">
  <div class="icons">
    <span>🐰</span>
    <span>🐱</span>
  </div>

  <h1 class="intro-title">
    Ready for another surprise?
  </h1>

  <button id="openBtn">
    Open your surprise ♡
  </button>
</div>

<main id="garden">
  <h1 class="garden-title">
    A garden just for you ♡
  </h1>

  <span class="side-flower one">✿</span>
  <span class="side-flower two">❀</span>
  <span class="side-flower three">✿</span>
  <span class="side-flower four">❀</span>

  <div class="flower-orbit">

    <div class="flower">
      <img src="https://images.unsplash.com/photo-1561181286-d3fee7d55364?w=500" alt="Pink lily">
    </div>

    <div class="flower">
      <img src="https://images.unsplash.com/photo-1520763185298-1b434c919102?w=500" alt="Pink tulips">
    </div>

    <div class="flower">
      <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=500" alt="Pink flowers">
    </div>

    <div class="flower">
      <img src="https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?w=500" alt="Pink floral arrangement">
    </div>

    <div class="center-heart">♡</div>

  </div>
</main>

<audio id="backgroundmusic.mp3" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music-control" id="musicBtn" aria-label="Toggle music">♫</button>

<script>
const intro = document.getElementById('intro');
const garden = document.getElementById('garden');
const openBtn = document.getElementById('openBtn');
const music = document.getElementById('backgroundMusic');
const musicBtn = document.getElementById('musicBtn');

let musicPlaying = false;
let petalTimer;

openBtn.addEventListener('click', async () => {
  intro.classList.add('hide');
  garden.classList.add('show');

  music.volume = 0.45;

  try {
    await music.play();
    musicPlaying = true;
    musicBtn.textContent = '♫';
  } catch (error) {
    musicBtn.textContent = '♪';
  }

  musicBtn.style.display = 'block';

  if (!petalTimer) {
    petalTimer = setInterval(createPetal, 500);
  }
});

musicBtn.addEventListener('click', async () => {
  if (music.paused) {
    try {
      await music.play();
      musicBtn.textContent = '♫';
    } catch (error) {
      musicBtn.textContent = '♪';
    }
  } else {
    music.pause();
    musicBtn.textContent = '♪';
  }
});

function createPetal() {
  const petal = document.createElement('span');
  petal.className = 'petal';
  petal.textContent = Math.random() > 0.5 ? '✿' : '❀';

  petal.style.left = Math.random() * 100 + 'vw';
  petal.style.fontSize = (12 + Math.random() * 15) + 'px';
  petal.style.animationDuration = (7 + Math.random() * 7) + 's';

  document.body.appendChild(petal);

  setTimeout(() => petal.remove(), 15000);
}
</script>

</body>
</html>

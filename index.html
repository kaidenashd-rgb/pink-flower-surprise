
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8e7ec">
<title>A Little Garden of Love</title>
<style>
:root{--ink:#765363;--rose:#d987a8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8e7ec}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);overscroll-behavior:none}
#scene{position:fixed;inset:0;touch-action:none;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 35%,rgba(180,119,145,.10) 100%),linear-gradient(180deg,rgba(255,255,255,.25),transparent 40%,rgba(255,245,248,.25)}
.top{position:fixed;top:max(24px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;padding:0 20px}
.eyebrow{font:10px/1.4 Arial,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:#b27b91}
h1{font-weight:400;font-size:clamp(25px,5vw,42px);letter-spacing:.025em;margin:8px 0 5px;color:#875d70;text-shadow:0 2px 20px #fff}
.sub{font:12px/1.5 Arial,sans-serif;letter-spacing:.08em;color:#a47d8e}
.hint{position:fixed;bottom:max(25px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap;border:1px solid rgba(176,125,148,.28);border-radius:30px;padding:10px 16px;background:rgba(255,250,249,.58);backdrop-filter:blur(12px);font:10px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#936c7e;pointer-events:none}
.hint span{display:inline-block;margin:0 7px;color:#d28ba9}
#replay,#music{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));border:1px solid rgba(176,125,148,.35);background:rgba(255,250,249,.72);color:#936c7e;border-radius:50%;width:40px;height:40px;cursor:pointer;backdrop-filter:blur(10px)}
#replay{right:18px;font-size:17px}
#music{right:66px;font-size:16px}
#replay:active,#music:active{transform:scale(.94)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f8e7ec;z-index:5;transition:opacity 1s ease;pointer-events:none}
#loading.hide{opacity:0}
.loadtext{font:11px Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#b27b91}
@media(max-width:600px){h1{font-size:29px}.sub{font-size:10px}.hint{font-size:9px;padding:9px 13px;bottom:max(22px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>

<header class="top">
<div class="eyebrow">a garden made just for you</div>
<h1>In Full Bloom</h1>
<div class="sub">a little wonder, gathered petal by petal</div>
</header>

<div class="hint"><span>✧</span> touch and drag to turn your bouquet <span>✧</span></div>

<button id="replay" aria-label="Replay flower formation">↻</button>
<button id="music" aria-label="Turn background music on">♫</button>

<!-- Replace music.mp3 with your own audio filename if desired -->
<audio id="bgMusic" src="backgroundmusic.mp3.mp3.mp3" loop preload="auto"></audio>

<div id="loading"><div class="loadtext">gathering a little magic…</div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xf8e7ec,10,25);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.2,11.8);

scene.add(new THREE.HemisphereLight(0xfff7fb,0x8b6875,2));
const key=new THREE.DirectionalLight(0xfff2f5,2.8);
key.position.set(-4,7,7);scene.add(key);
const fill=new THREE.PointLight(0xf6a9c6,38,18);
fill.position.set(4,2,5);scene.add(fill);
const rim=new THREE.PointLight(0xffffff,25,16);
rim.position.set(-3,4,-4);scene.add(rim);

const bouquet=new THREE.Group();scene.add(bouquet);
const flowerLayer=new THREE.Group();bouquet.add(flowerLayer);

const petalMats=[
new THREE.MeshStandardMaterial({color:0xf5a9c5,roughness:.58,side:THREE.DoubleSide}),
new THREE.MeshStandardMaterial({color:0xffc5d7,roughness:.55,side:THREE.DoubleSide}),
new THREE.MeshStandardMaterial({color:0xd978a0,roughness:.62,side:THREE.DoubleSide}),
new THREE.MeshStandardMaterial({color:0xffdce5,roughness:.5,side:THREE.DoubleSide})
];

const greenMat=new THREE.MeshStandardMaterial({color:0x668b69,roughness:.8,side:THREE.DoubleSide});
const stemMat=new THREE.MeshStandardMaterial({color:0x547c60,roughness:.85});
const centerMat=new THREE.MeshStandardMaterial({color:0xe7a94f,roughness:.55});
const whiteMat=new THREE.MeshStandardMaterial({color:0xfff8f0,roughness:.65});
const pinkTiny=new THREE.MeshStandardMaterial({color:0xe9a1bb,roughness:.7});
const sphereGeo=new THREE.SphereGeometry(1,10,8);

function tube(points,r,mat,parent=flowerLayer){
const curve=new THREE.CatmullRomCurve3(points);
const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,24,r,7,false),mat);
parent.add(mesh);
return mesh;
}

function petalGeometry(length,width,bend=.18,tip=.12){
const verts=[],uv=[],idx=[],N=12,M=10;
for(let i=0;i<=N;i++){
const t=i/N;
const w=Math.pow(Math.sin(Math.PI*t),.72)*width*(.32+.68*t)+.025;
for(let j=0;j<=M;j++){
const u=j/M*2-1;
const x=u*w;
const y=t*length;
const z=bend*t*t+.15*(u*u)*Math.sin(Math.PI*t)+tip*Math.pow(Math.abs(u),2)*t;
verts.push(x,y,z);
uv.push(j/M,t);
}
}
for(let i=0;i<N;i++)for(let j=0;j<M;j++){
let a=i*(M+1)+j,b=a+M+1;
idx.push(a,b,a+1,b,b+1,a+1);
}
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
g.setIndex(idx);
g.computeVertexNormals();
return g;
}

const lilyPetalGeo=petalGeometry(1.22,.31,.22,.16);
const tulipPetalGeo=petalGeometry(.83,.34,.12,.03);

function addPetal(parent,geo,mat,angle,tilt,scale=1){
const p=new THREE.Mesh(geo,mat);
p.rotation.y=angle;
p.rotation.x=tilt;
p.scale.setScalar(scale);
parent.add(p);
return p;
}

function makeLily(pos,scale,rotation=0){
const g=new THREE.Group();
g.position.copy(pos);
g.rotation.y=rotation;
g.scale.setScalar(scale);
flowerLayer.add(g);

const head=new THREE.Group();
g.add(head);

for(let i=0;i<6;i++){
const a=i*Math.PI/3;
const p=addPetal(head,lilyPetalGeo,petalMats[(i%3===0)?1:(i%2?0:3)],a,-.36+(i%2)*.10,1);
p.rotation.z=(i%2?-.08:.08);
}

const throat=new THREE.Mesh(
new THREE.SphereGeometry(.22,16,12),
new THREE.MeshStandardMaterial({color:0xffe4d8,roughness:.45})
);
throat.scale.set(.82,.42,.82);
throat.position.y=.10;
head.add(throat);

for(let i=0;i<6;i++){
const a=i*Math.PI/3+.2;
const end=new THREE.Vector3(Math.cos(a)*.42,.44,Math.sin(a)*.42);
tube([
new THREE.Vector3(0,.05,0),
new THREE.Vector3(Math.cos(a)*.22,.25,Math.sin(a)*.22),
end
],.012,stemMat,head);

const anther=new THREE.Mesh(sphereGeo,centerMat);
anther.position.copy(end);
anther.scale.set(.09,.035,.045);
head.add(anther);
}
return g;
}

function makeTulip(pos,scale,rotation=0){
const g=new THREE.Group();
g.position.copy(pos);
g.rotation.y=rotation;
g.scale.setScalar(scale);
flowerLayer.add(g);

const cup=new THREE.Group();
g.add(cup);

for(let i=0;i<6;i++){
const a=i*Math.PI/3;
const p=addPetal(cup,tulipPetalGeo,petalMats[[0,1,2,1,3,0][i]],a,-.15,1);
p.position.y=-.02;
}

const core=new THREE.Mesh(new THREE.SphereGeometry(.20,16,12),petalMats[1]);
core.scale.set(.8,.55,.8);
core.position.y=.26;
cup.add(core);
return g;
}

function makeLeaf(start,end,width,twist=0){
const dir=new THREE.Vector3().subVectors(end,start);
const len=dir.length();
const geo=petalGeometry(len,width,.16,.02);
const leaf=new THREE.Mesh(geo,greenMat);
leaf.position.copy(start);
leaf.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
leaf.rotateY(twist);
flowerLayer.add(leaf);

tube([
start.clone().lerp(end,.08),
start.clone().lerp(end,.48).add(new THREE.Vector3(0,.04,0)),
end
],.009,stemMat);
return leaf;
}

function stemFor(x,z,height,lean=0){
const base=new THREE.Vector3(x*.25,-2.65,z*.25);
const top=new THREE.Vector3(x,-2.65+height,z);
tube([
base,
new THREE.Vector3(x*.55+lean*.2,-1.6,z*.55),
new THREE.Vector3(x*.86+lean,-.65,z*.86),
top
],.027,stemMat);

makeLeaf(
new THREE.Vector3(x*.36,-2.1,z*.36),
new THREE.Vector3(x*.36-.45,-1.15,z*.36-.08),
.16,.5
);

if(height>2.3){
makeLeaf(
new THREE.Vector3(x*.68,-1.2,z*.68),
new THREE.Vector3(x*.68+.42,-.45,z*.68+.06),
.14,-.6
);
}
return top;
}

// Main bouquet arrangement
const flowers=[
{type:'l',p:[-1.55,1.15,0],s:.83},
{type:'l',p:[1.52,1.2,-.1],s:.86},
{type:'l',p:[0,2.05,-.45],s:.94},
{type:'l',p:[-2.05,.12,-.25],s:.69},
{type:'l',p:[2.08,.18,-.35],s:.7},
{type:'t',p:[-.92,1.62,.68],s:.72},
{type:'t',p:[.88,1.65,.72],s:.74},
{type:'t',p:[-1.8,.72,.52],s:.68},
{type:'t',p:[1.78,.76,.52],s:.68},
{type:'t',p:[-.62,.55,.92],s:.72},
{type:'t',p:[.58,.55,.94],s:.72},
{type:'t',p:[0,1.1,1.02],s:.76},
{type:'t',p:[-1.15,2.15,-.1],s:.6},
{type:'t',p:[1.16,2.18,-.12],s:.6}
];

flowers.forEach((f,i)=>{
const p=new THREE.Vector3(...f.p);
stemFor(p.x,p.z,2+(p.y+2.65)*.45,p.x*.08);
if(f.type==='l')makeLily(p,f.s,i*.41);
else makeTulip(p,f.s,i*.73);
});

// Leaves
for(let i=0;i<18;i++){
const side=i%2?1:-1;
const row=Math.floor(i/2);
const start=new THREE.Vector3(side*(.18+row*.12),-2.5+row*.16,-.45+(i%3)*.28);
const end=new THREE.Vector3(side*(1.1+row*.13),-1.75+row*.22,-.5+(i%3)*.26);
makeLeaf(start,end,.20+(i%3)*.025,side*.5);
}

// Baby's breath and filler flowers
for(let i=0;i<42;i++){
const a=i*2.399;
const r=.7+(i%7)*.19;
const x=Math.cos(a)*r;
const y=-.05+((i*7)%13)*.17;
const z=.35+Math.sin(a)*.42;
const base=new THREE.Vector3(x*.72,-2.45,z*.6);
const tip=new THREE.Vector3(x,y,z);

tube([
base,
base.clone().lerp(tip,.5).add(new THREE.Vector3(0,.18,0)),
tip
],.009,stemMat);

for(let j=0;j<3;j++){
const q=tip.clone().add(new THREE.Vector3(Math.cos(j*2.1)*.10,.08,Math.sin(j*2.1)*.10));
const b=new THREE.Mesh(sphereGeo,i%4===0?pinkTiny:whiteMat);
b.position.copy(q);
b.scale.set(.075,.075,.075);
flowerLayer.add(b);
}
}

// Bouquet ribbon
tube([
new THREE.Vector3(-.55,-2.55,.05),
new THREE.Vector3(0,-3.15,.12),
new THREE.Vector3(.55,-2.55,.05)
],.045,stemMat);

const ribbon=new THREE.Mesh(
new THREE.TorusGeometry(.43,.055,10,48),
new THREE.MeshStandardMaterial({color:0xe8a9bf,roughness:.4})
);
ribbon.position.set(0,-2.55,.15);
ribbon.rotation.x=Math.PI/2;
bouquet.add(ribbon);

const knot=new THREE.Mesh(
new THREE.SphereGeometry(.13,16,12),
new THREE.MeshStandardMaterial({color:0xf6cbd8,roughness:.4})
);
knot.position.set(0,-2.55,.2);
bouquet.add(knot);
bouquet.position.y=-.02;

// Particle formation
const particleCount=2100;
const positions=new Float32Array(particleCount*3);
const targets=new Float32Array(particleCount*3);
const sizes=new Float32Array(particleCount);

for(let i=0;i<particleCount;i++){
const a=Math.random()*Math.PI*2;
const radius=.12+Math.random()*2.15;
targets[i*3]=Math.cos(a)*radius;
targets[i*3+1]=-2.7+Math.random()*5.2;
targets[i*3+2]=Math.sin(a)*(.35+Math.random()*.7);
positions[i*3]=(Math.random()-.5)*.12;
positions[i*3+1]=-3.2+Math.random()*.25;
positions[i*3+2]=(Math.random()-.5)*.12;
sizes[i]=Math.random();
}

const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));

const pMat=new THREE.PointsMaterial({
color:0xf5b5cd,size:.035,transparent:true,opacity:.95,
depthWrite:false,blending:THREE.AdditiveBlending
});

const particles=new THREE.Points(pGeo,pMat);
bouquet.add(particles);

const trailGeo=new THREE.BufferGeometry();
const trailPos=new Float32Array(420*3);
trailGeo.setAttribute('position',new THREE.BufferAttribute(trailPos,3));

const trailMat=new THREE.PointsMaterial({
color:0xffe8f0,size:.022,transparent:true,opacity:.8,
depthWrite:false,blending:THREE.AdditiveBlending
});

const trails=new THREE.Points(trailGeo,trailMat);
scene.add(trails);

// Butterflies
const butterflies=[];
const wingMatPink=new THREE.MeshBasicMaterial({
color:0xe89bb9,side:THREE.DoubleSide,transparent:true,opacity:.9
});
const wingMatCream=new THREE.MeshBasicMaterial({
color:0xfff6ef,side:THREE.DoubleSide,transparent:true,opacity:.95
});

function makeButterfly(i){
const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.018,.12,3,6),
new THREE.MeshBasicMaterial({color:0x806071})
);
body.rotation.z=Math.PI/2;
g.add(body);

const wings=[];

for(const side of [-1,1]){
for(const upper of [true,false]){
const shape=new THREE.Shape();
shape.moveTo(0,0);
shape.quadraticCurveTo(side*.12,upper?.19:.12,side*.25,upper?.13:.07);
shape.quadraticCurveTo(side*.22,upper?.01:-.09,0,0);

const mesh=new THREE.Mesh(
new THREE.ShapeGeometry(shape,10),
i%3===0?wingMatCream:wingMatPink
);
mesh.position.set(0,upper?.015:-.015,side*.015);
mesh.rotation.y=side*.2;
g.add(mesh);
wings.push({mesh,side,upper});
}
}

scene.add(g);
butterflies.push({
g,wings,
speed:.35+Math.random()*.3,
radius:2.6+Math.random()*1.2,
offset:Math.random()*6.28
});
}

for(let i=0;i<7;i++)makeButterfly(i);

// Floating dust
const dustN=250;
const dustA=new Float32Array(dustN*3);

for(let i=0;i<dustN;i++){
dustA[i*3]=(Math.random()-.5)*12;
dustA[i*3+1]=(Math.random()-.5)*9;
dustA[i*3+2]=-1-Math.random()*5;
}

const dustG=new THREE.BufferGeometry();
dustG.setAttribute('position',new THREE.BufferAttribute(dustA,3));

const dust=new THREE.Points(
dustG,
new THREE.PointsMaterial({color:0xfff6fa,size:.018,transparent:true,opacity:.65})
);
scene.add(dust);

// Animation and interaction
let start=performance.now();
let dragging=false;
let lastX=0,lastY=0;
let velX=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resetBloom(){
start=performance.now();
flowerLayer.visible=true;
flowerLayer.scale.setScalar(.001);
particles.visible=true;
}

document.querySelector('#replay').addEventListener('click',resetBloom);

// ==================================
// BACKGROUND MUSIC CONTROLS
// ==================================

const music=document.querySelector('#bgMusic');
const musicButton=document.querySelector('#music');

music.volume=.45;
let musicStarted=false;

async function startMusic(){
try{
await music.play();
musicStarted=true;
musicButton.textContent='♫';
musicButton.setAttribute('aria-label','Turn background music off');
musicButton.title='Turn music off';
}catch(error){
musicButton.textContent='♪';
musicButton.setAttribute('aria-label','Play background music');
}
}

function toggleMusic(){
if(music.paused){
startMusic();
}else{
music.pause();
musicButton.textContent='♪';
musicButton.setAttribute('aria-label','Turn background music on');
musicButton.title='Turn music on';
}
}

musicButton.addEventListener('click',e=>{
e.stopPropagation();
toggleMusic();
});

// Try to start music on the first interaction.
// This is necessary because iPhones block automatic audio playback.
function startMusicAfterFirstTap(){
if(!musicStarted && music.paused)startMusic();
}

document.addEventListener('pointerdown',startMusicAfterFirstTap,{once:true});

// ==================================
// BOUQUET ROTATION
// ==================================

canvas.addEventListener('pointerdown',e=>{
dragging=true;
lastX=e.clientX;
lastY=e.clientY;
velX=0;
canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove',e=>{
if(!dragging)return;

const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

bouquet.rotation.y+=dx*.009;
bouquet.rotation.x=clamp(bouquet.rotation.x+dy*.006,-.65,.65);

velX=dx*.0009;
lastX=e.clientX;
lastY=e.clientY;
});

function stopDrag(){dragging=false}
canvas.addEventListener('pointerup',stopDrag);
canvas.addEventListener('pointercancel',stopDrag);
canvas.addEventListener('lostpointercapture',stopDrag);

canvas.addEventListener('wheel',e=>{
e.preventDefault();
camera.position.z=clamp(camera.position.z+e.deltaY*.008,8.5,14);
},{passive:false});

// Main animation
const clock=new THREE.Clock();

function animate(now){
requestAnimationFrame(animate);

const elapsed=(now-start)/1000;
const dt=Math.min(clock.getDelta(),.04);
const progress=clamp(elapsed/7.2,0,1);
const eased=1-Math.pow(1-progress,3);

if(progress<1){
const attr=pGeo.attributes.position;

for(let i=0;i<particleCount;i++){
const delay=sizes[i]*.42;
const local=clamp((progress-delay)/(1-delay),0,1);
const k=i*3;
const drift=Math.sin(now*.0015+i)*.025*(1-local);

attr.array[k]=targets[k]*local+drift;
attr.array[k+1]=-3.1+(targets[k+1]+3.1)*local;
attr.array[k+2]=targets[k+2]*local+Math.cos(now*.001+i)*.03*(1-local);
}

attr.needsUpdate=true;
flowerLayer.scale.setScalar(Math.max(.001,eased));
pMat.opacity=1-progress*.8;

}else{
particles.visible=false;
flowerLayer.scale.setScalar(1);
}

// Particle trails
const ta=trailGeo.attributes.position;

for(let i=0;i<140;i++){
const a=i*.37+now*.0003;
const h=((i*17+now*.04)%300)/300*5.2;

ta.array[i*3]=Math.sin(a)*h*.43;
ta.array[i*3+1]=-3.1+h;
ta.array[i*3+2]=Math.cos(a)*h*.16;
}

ta.needsUpdate=true;
trailMat.opacity=progress<1?.65*(1-progress*.5):.12;

// Gentle momentum
if(!dragging){
bouquet.rotation.y+=velX;
bouquet.rotation.x=THREE.MathUtils.damp(bouquet.rotation.x,0,1.2,dt);
velX*=.96;
}

bouquet.rotation.y+=Math.sin(now*.00018)*.00035;

// Butterfly flight
butterflies.forEach((b,i)=>{
const t=now*.00035*b.speed+b.offset;

b.g.position.set(
Math.sin(t)*b.radius*.8+Math.sin(t*.47)*.4,
Math.cos(t*1.3)*1.45+.2,
i%2===0?Math.cos(t)*1.5:-1.5+Math.sin(t*.7)
);

b.g.rotation.y=Math.sin(t+.5)*.7;
b.g.rotation.z=Math.cos(t)*.18;

b.wings.forEach(w=>{
w.mesh.rotation.y=w.side*(.35+Math.abs(Math.sin(now*.012+i))*1.05);
});
});

dust.rotation.y=now*.000025;

renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// Responsive layout
function resize(){
camera.aspect=innerWidth/innerHeight;
camera.position.z=innerWidth<600?13.4:11.8;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
}

addEventListener('resize',resize);

setTimeout(()=>document.querySelector('#loading').classList.add('hide'),850);
setTimeout(()=>document.querySelector('#loading').remove(),1900);
</script>
</body>
</html>
